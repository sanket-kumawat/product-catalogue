services:
  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025'
      - '1025:1025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:8080
      FAKE_STORE_BASE_URL: https://fakestoreapi.com
      PRODUCT_CACHE_TTL_MS: 300000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      EMAIL_FROM: no-reply@product-catalogue.local
      SALES_INBOX_EMAIL: sales@product-catalogue.local
      ENQUIRY_RATE_LIMIT_WINDOW_MS: 60000
      ENQUIRY_RATE_LIMIT_MAX: 10
    depends_on:
      - mailpit
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
